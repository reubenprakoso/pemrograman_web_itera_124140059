<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kantin POS - Praktikum PAW ITERA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Kantin POS - Mini Point of Sale</h1>
            <p>Praktikum Pengembangan Aplikasi Web - Pertemuan 1</p>
        </header>

        <main class="pos-wrapper">
            <!-- Form Input Barang -->
            <section class="card form-section">
                <h2>Tambah Barang</h2>
                <form id="form-barang" novalidate>
                    <div class="form-group">
                        <label for="nama-barang">Nama Barang</label>
                        <input type="text" id="nama-barang" placeholder="Contoh: Nasi Goreng">
                        <small class="error-msg" id="error-nama"></small>
                    </div>

                    <div class="form-group">
                        <label for="harga-barang">Harga Satuan (Rp)</label>
                        <input type="number" id="harga-barang" placeholder="Minimal Rp 500">
                        <small class="error-msg" id="error-harga"></small>
                    </div>

                    <div class="form-group">
                        <label for="qty-barang">Jumlah (Qty)</label>
                        <input type="number" id="qty-barang" value="1" min="1">
                        <small class="error-msg" id="error-qty"></small>
                    </div>

                    <button type="submit" id="btn-tambah" class="btn btn-primary">Tambah ke Keranjang</button>
                </form>
            </section>

            <!-- Tabel Keranjang Belanja -->
            <section class="card table-section">
                <div class="table-header">
                    <h2>Keranjang Belanja</h2>
                    <button id="btn-reset" class="btn btn-danger-outline">Reset Keranjang</button>
                </div>

                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>No</th>
                                <th>Nama Barang</th>
                                <th>Harga</th>
                                <th>Qty</th>
                                <th>Subtotal</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-keranjang">
                            <!-- Data dinamis dimasukkan via JS -->
                        </tbody>
                    </table>
                </div>

                <!-- Ringkasan & Kalkulator Pembayaran -->
                <div class="summary-box">
                    <div class="summary-row">
                        <span>Total Belanja:</span>
                        <strong id="text-total">Rp 0</strong>
                    </div>

                    <div class="form-group inline-promo">
                        <label for="kode-promo">Kode Promo (HEMAT10):</label>
                        <input type="text" id="kode-promo" placeholder="Masukkan kode promo">
                    </div>

                    <div class="summary-row text-discount">
                        <span>Diskon (10%):</span>
                        <strong id="text-diskon">Rp 0</strong>
                    </div>

                    <div class="summary-row text-final">
                        <span>Total Akhir:</span>
                        <strong id="text-total-akhir">Rp 0</strong>
                    </div>

                    <hr>

                    <div class="payment-box">
                        <div class="form-group">
                            <label for="uang-bayar">Uang Bayar (Rp)</label>
                            <input type="number" id="uang-bayar" placeholder="Masukkan nominal uang">
                            <small class="error-msg" id="error-bayar"></small>
                        </div>

                        <div class="summary-row text-change">
                            <span>Kembalian / Status:</span>
                            <strong id="text-kembalian">-</strong>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
